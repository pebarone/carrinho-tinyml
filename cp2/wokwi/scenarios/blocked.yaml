name: "Bloqueado a 15 cm nao aciona motores"
version: 1
author: "CP2 TinyML - Carrinho"
steps:
  - wait-serial: "# TinyML: A arma, S para"
  - write-serial: "A"
  - delay: 1500ms
  - wait-serial: "# inference,bloqueado"
  - wait-serial: "action=0"
  - expect-pin:
      part-id: esp
      pin: 25
      expected: 0
  - expect-pin:
      part-id: esp
      pin: 26
      expected: 0
  - expect-pin:
      part-id: esp
      pin: 27
      expected: 0
  - expect-pin:
      part-id: esp
      pin: 33
      expected: 0
  - expect-pin:
      part-id: esp
      pin: 32
      expected: 0
  - expect-pin:
      part-id: esp
      pin: 21
      expected: 0
