name: "Distancia de emergencia a 5 cm mantem motores parados"
version: 1
author: "CP2 TinyML - Carrinho"
steps:
  - wait-serial: "# TinyML: A arma, S para"
  - write-serial: "A"
  - delay: 300ms
  - wait-serial: ",1"
  - expect-pin:
      part-id: esp
      pin: 25
      expected: 0
  - expect-pin:
      part-id: esp
      pin: 26
      expected: 0
  - expect-pin:
      part-id: esp
      pin: 27
      expected: 0
  - expect-pin:
      part-id: esp
      pin: 33
      expected: 0
  - expect-pin:
      part-id: esp
      pin: 32
      expected: 0
  - expect-pin:
      part-id: esp
      pin: 21
      expected: 0
