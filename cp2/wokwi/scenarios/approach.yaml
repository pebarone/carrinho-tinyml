name: "Alvo estatico a 45 cm: progresso lento sem travamento"
version: 1
author: "CP2 TinyML - Carrinho"
steps:
  - wait-serial: "# TinyML autonomo: partida em 5s; S para/cancela; A rearma"
  - wait-serial: "# auto_armed"
  - wait-serial: "# drive,action=1,"
  - expect-pin:
      part-id: esp
      pin: 26
      expected: 1
  - expect-pin:
      part-id: esp
      pin: 27
      expected: 0
  - expect-pin:
      part-id: esp
      pin: 32
      expected: 0
  - expect-pin:
      part-id: esp
      pin: 21
      expected: 1
  - write-serial: "S"
  - wait-serial: "# disarmed"
  - expect-pin:
      part-id: esp
      pin: 25
      expected: 0
  - expect-pin:
      part-id: esp
      pin: 26
      expected: 0
  - expect-pin:
      part-id: esp
      pin: 27
      expected: 0
  - expect-pin:
      part-id: esp
      pin: 33
      expected: 0
  - expect-pin:
      part-id: esp
      pin: 32
      expected: 0
  - expect-pin:
      part-id: esp
      pin: 21
      expected: 0
